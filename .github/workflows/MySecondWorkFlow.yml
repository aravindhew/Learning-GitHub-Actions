name: Second Workflow

on:
  workflow_run:
    workflows: ["First Workflow"]   # must match name exactly
    types:
      - completed

jobs:
  next:
    runs-on: ubuntu-latest

    # ✅ Run only if first workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - run: echo "Running Second Workflow"

jobs:
  unit-test:
    name: unit-test
    runs-on: ubuntu-latest
    steps:
        - name: checkout    
          uses: actions/checkout@v5.0.0
        - name: setup python
          uses: actions/setup-python@v6.0.0
          with:
            python-version: '3.x'
        - name: install dependencies
          run: |
             python -m pip install --upgrade pip
             pip install -r requirements.txt
        - name: run unit tests
          run: |
             mkdir -p test-reports
             pytest --junitxml=test-reports/results.xml --cov=. --cov-report=xml --cov-report=term-missing -v
        - name: Upload test report
          uses: actions/upload-artifact@v5.0.0
          with:
            name: test-report
            path: test-reports/
