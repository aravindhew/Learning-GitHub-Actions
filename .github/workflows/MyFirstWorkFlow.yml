name: First Workflow
on:
  push:  
    branches:
      - dev
      - feature-*
      - main
  workflow_dispatch: 
env:
  ENV_TYPE: dev
  APP_USER: thinknyx
  APP_PORT: 80


jobs:
  unit-test:
    name: unit-test
    runs-on: ubuntu-latest
    steps:
        - name: checkout    
          uses: actions/checkout@v5.0.0
        - name: setup python
          uses: actions/setup-python@v6.0.0
          with:
            python-version: '3.x'
        - name: install dependencies
          run: |
             python -m pip install --upgrade pip
             pip install -r requirements.txt
        - name: run unit tests
          run: |
             mkdir -p test-reports
             pytest --junitxml=test-reports/results.xml --cov=. --cov-report=xml --cov-report=term-missing -v
        - name: Upload test report
          uses: actions/upload-artifact@v5.0.0
          with:
            name: test-report
            path: test-reports/
  code-quality:
    name: code-quality
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      matrix:
        language: [python]
    steps:
        - name: checkout    
          uses: actions/checkout@v5.0.0
        - name: initialize codeql
          uses: github/codeql-action/init@v3
          with:
            languages: ${{ matrix.language }}
        - name: perform codeql analysis
          uses: github/codeql-action/analyze@v3
          with:
            category: "security"

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build:
    name: build-and-push
    runs-on: ubuntu-latest

    # 🔐 Attach environment
    environment: STAGING

    outputs:
      image-tag: ${{ steps.vars.outputs.IMAGE_TAG }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 🔐 Login using STAGING env secrets
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # 🏷️ Generate proper image tag
      - name: Generate image tag
        id: vars
        run: |
          set -e
          IMAGE_TAG=${{ secrets.DOCKER_USERNAME }}/thinknyx:${GITHUB_SHA::8}
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_OUTPUT

      # 🐳 Build & Push
      - name: Build and push docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.IMAGE_TAG }}

      # 📦 Save image locally
      - name: Save image to tar
        run: |
          docker pull ${{ steps.vars.outputs.IMAGE_TAG }}
          docker save ${{ steps.vars.outputs.IMAGE_TAG }} -o image.tar

      # 📤 Upload artifact
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar          

  trivy-scan:
    name: trivy-container-scan
    runs-on: ubuntu-latest
    needs: build                          # Wait for build job to finish

    permissions:
      security-events: write              # Required to upload SARIF
      contents: read

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image              # Same name as upload in build job

      - name: Load Docker image from tar
        run: docker load -i image.tar

      - name: Run Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          input: image.tar                # Scan from local tar, not registry
          format: sarif
          output: trivy-container.sarif
          #severity: HIGH,CRITICAL
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'                  # Non-blocking; change to '1' to fail pipeline
      - name: Debug Trivy output
        run: |
          trivy image --input image.tar --severity LOW,MEDIUM,HIGH,CRITICAL
      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-container.sarif
          category: trivy-container       # Label shown in Security tab
        if: always()                      # Upload even if scan finds vulnerabilities
      
  artifact_test:
    name: artifact-test
    runs-on: ubuntu-latest
    steps:
      - name: create a test file
        run: |
          echo "This is a test file" > test.txt
      - name: upload test artifact
        uses: actions/upload-artifact@v5.0.0
        with:
          name: test-artifact
          path: test.txt
  artifact_download:
    name: artifact-download
    runs-on: ubuntu-latest
    needs: artifact_test
    steps:
      - name: download test artifact
        uses: actions/download-artifact@v5.0.0
        with:
          name: test-artifact
      
      - name: display artifact content
        run: |
          cat test.txt